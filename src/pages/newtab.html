<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data:">
  <title>Neuer Tab</title>
  <link rel="stylesheet" href="internal.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>
  <div class="grain"></div>
  <main class="ntp">
    <section class="hero">
      <div class="clock" id="clock">--:--</div>
      <div class="greet"><span id="greeting">Hallo</span><span class="sep">·</span><span id="date"></span></div>
    </section>

    <form class="search" id="search" autocomplete="off">
      <svg viewBox="0 0 24 24" class="s-ico"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Suchen oder Adresse eingeben" spellcheck="false">
      <span class="engine" id="engine">Google</span>
    </form>

    <section class="shelf">
      <div class="shelf-head"><h2>Favoriten</h2><span class="hint">Ziehen zum Sortieren</span></div>
      <div class="tiles" id="favs"></div>
    </section>

    <section class="shelf" id="top-shelf" hidden>
      <div class="shelf-head"><h2>Häufig besucht</h2></div>
      <div class="tiles small" id="top"></div>
    </section>

    <footer class="stats" id="stats"></footer>
  </main>

  <dialog id="edit" class="editor">
    <form method="dialog" id="edit-form">
      <h3 id="edit-title">Favorit hinzufügen</h3>
      <label>Name<input id="edit-name" autocomplete="off" placeholder="z. B. Nachrichten"></label>
      <label>Adresse<input id="edit-url" autocomplete="off" spellcheck="false" placeholder="z. B. tagesschau.de" required></label>
      <p class="err" id="edit-err"></p>
      <div class="edit-foot">
        <button type="button" class="b ghost danger" id="edit-del">Entfernen</button>
        <span class="grow"></span>
        <button type="button" class="b ghost" id="edit-cancel">Abbrechen</button>
        <button type="submit" class="b" id="edit-save">Fertig</button>
      </div>
    </form>
  </dialog>
  <script src="shared/i18n.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
